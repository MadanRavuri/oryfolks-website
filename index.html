<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/oryfolkslogo1.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/oryfolkslogo1.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#4071bf" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>OryFolks</title>
    <meta
      name="description"
      content="OryFolks - A premier organization dedicated to community development and innovative solutions."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="OryFolks" />
    <meta property="og:description" content="OryFolks - A premier organization dedicated to community development and innovative solutions." />
    <meta property="og:image" content="/oryfolkslogo1.png" />
    <meta property="og:image:alt" content="OryFolks logo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oryfolks.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OryFolks" />
    <meta name="twitter:description" content="OryFolks - A premier organization dedicated to community development and innovative solutions." />
    <meta name="twitter:image" content="/oryfolkslogo1.png" />

    <!-- Critical CSS Preload -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print" onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//images.pexels.com" />
    
    <!-- Preload critical hero images -->
    <link rel="preload" as="image" href="/homepage.webp" type="image/webp">
    <link rel="preload" as="image" href="/services-hero.webp" type="image/webp">
    <link rel="preload" as="image" href="/about-hero.webp" type="image/webp">
    <link rel="preload" as="image" href="/contact-hero.webp" type="image/webp">
    
    <!-- Optimize image loading with compression hints -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Accept-CH" content="Width, DPR, Viewport-Width, Device-Memory, RTT, Downlink">

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OryFolks",
        "url": "https://oryfolks.com",
        "logo": "https://oryfolks.com/oryfolkslogo1.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
